# Default values for pyroscope.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

architecture:
  microservices:
    enabled: true

pyroscope:
  components:
    query-frontend:
      kind: Deployment
      replicaCount: 2
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 32Mi
          cpu: 10m
    query-backend:
      kind: Deployment
      replicaCount: 2
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 32Mi
          cpu: 10m
    distributor:
      kind: Deployment
      replicaCount: 2
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 32Mi
          cpu: 50m
    segment-writer:
      kind: StatefulSet
      replicaCount: 3
      resources:
        limits:
          memory: 4Gi
        requests:
          memory: 256Mi
          cpu: 100m
      initContainers: []
    metastore:
      kind: StatefulSet
      replicaCount: 3
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 64Mi
          cpu: 10m
    compaction-worker:
      kind: StatefulSet
      replicaCount: 3
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 64Mi
          cpu: 10m

seaweedfs:
  enabled: true
