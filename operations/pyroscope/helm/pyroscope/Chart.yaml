apiVersion: v2
name: pyroscope
description: A horizontally scalable, highly available, multi-tenant continuous profiling database.
home: https://grafana.com/oss/pyroscope/
type: application
version: 2.3.1
appVersion: 2.3.1
dependencies:
  - name: grafana-agent
    alias: agent
    version: "0.44.2"
    repository: https://grafana.github.io/helm-charts
    condition: agent.enabled
  - name: alloy
    alias: alloy
    version: "1.5.2"
    repository: https://grafana.github.io/helm-charts
    condition: alloy.enabled
  - name: seaweedfs
    alias: seaweedfs
    version: 4.46.0
    repository: https://seaweedfs.github.io/seaweedfs/helm
    condition: seaweedfs.enabled
sources:
  - https://github.com/grafana/pyroscope
  - https://github.com/grafana/pyroscope/tree/main/operations/pyroscope/helm/pyroscope
